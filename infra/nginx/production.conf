# Booking Project — Nginx production reverse-proxy hardening.
#
# Role in the topology:
#   Client --TLS--> Nginx (this file) --plain HTTP--> NestJS API / Next.js web.
# TLS terminates here; the internal hop stays plain HTTP. TRUSTED_PROXY on the
# NestJS side MUST list this proxy's IP/CIDR so `X-Forwarded-*` below is
# honoured and client-supplied spoofed headers never reach the API.
# Never commit real domains, IPs or secrets here — replace the placeholders.

# Flood/DoS guard: 10 req/s average per client IP with a burst of 20.
# Tune `rate=` to the booking traffic profile; login/auth endpoints get a
# stricter zone in the server block below.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstreams (same host or private network only).
upstream booking_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream booking_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name booking.example.com;

    # Hide version details from scanners.
    server_tokens off;

    # --- Payload limits (DoS via large bodies) ---
    client_max_body_size 5M;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # --- Modern TLS only ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # ssl_certificate / ssl_certificate_key are provisioned by the operator
    # (certbot / internal PKI) and intentionally NOT stored in this repo.
    # ssl_certificate     /etc/nginx/tls/booking.example.com/fullchain.pem;
    # ssl_certificate_key /etc/nginx/tls/booking.example.com/privkey.pem;

    # HSTS: only after TLS + domain rollout is verified; keep preload OFF
    # until subdomains are audited (matches docs/SECURITY.md rollout rule).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- API ---
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://booking_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Canonical proxy headers expected by NestJS TRUSTED_PROXY.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    # Stricter flood guard on auth endpoints (login/register/OTP/reset).
    location ~ ^/api/auth/(login|register|verify-email|resend-verification|forgot-password|reset-password) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://booking_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    # --- Web (Next.js) ---
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://booking_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }
}

# Plain HTTP: redirect everything to HTTPS, no content served.
server {
    listen 80;
    listen [::]:80;
    server_name booking.example.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}
