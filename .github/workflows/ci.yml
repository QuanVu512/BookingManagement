name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: auth_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://auth_test:disposable_test_only@127.0.0.1:5432/auth_security_test
      AUTH_SECURITY_DATABASE_TEST_URL: postgresql://auth_test:disposable_test_only@127.0.0.1:5432/auth_security_test
      AUTH_SECURITY_REDIS_TEST_URL: redis://127.0.0.1:6379
      AUTH_SECURITY_REQUIRE_STORAGE: 'true'
      BOOKING_DATABASE_TEST_URL: postgresql://auth_test:disposable_test_only@127.0.0.1:5432/booking_mvp_test
      BOOKING_REDIS_TEST_URL: redis://127.0.0.1:6379
      BOOKING_REQUIRE_STORAGE: 'true'
      AUTH_MIGRATION_TEST_URL: postgresql://auth_test:disposable_test_only@127.0.0.1:5432/auth_validation_test
      AUTH_MIGRATION_REQUIRE_STORAGE: 'true'
      NEXT_PUBLIC_API_URL: https://api.example.test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate persistence client types
        run: npm run prisma:generate
      - name: Migrate disposable auth test database
        run: npm run prisma:migrate:deploy

      - name: Create and migrate isolated booking test database
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE booking_mvp_test'
          DATABASE_URL="$BOOKING_DATABASE_TEST_URL" npm run prisma:migrate:deploy
      - name: Create isolated phone migration test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE auth_validation_test'
      - name: Auth storage integration
        run: npm run test:auth:storage
      - name: Booking PostgreSQL integration (UTC runner)
        run: |
          TZ=UTC npm run test:booking:integration
          TZ=UTC npm run test:booking:ui

      - name: Dependency and focused source security gates
        run: |
          npm audit --audit-level=high
          node tools/security-source-check.mjs

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Auth HTTP, frontend and phone audit checks
        run: |
          npm run test:auth:contract
          npm run test:auth:security
          npm run test:auth:ui
          npm run test:auth:phones

      - name: Build API and frontend
        run: |
          npm run build
          npm run build:web
